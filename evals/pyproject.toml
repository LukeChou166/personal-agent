[project]
name = "claude-code-evals"
version = "0.1.0"
description = "Harbor eval harness for the reverse-engineered claude-code CLI."
requires-python = ">=3.12,<3.14"
# Harbor 是评测框架。pin 版本与参考项目一致以保证可复现。
dependencies = [
  "harbor==0.18.0",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 只有自定义 agent 需要被 import（harbor 通过 --agent 路径加载）。
only-include = ["claude_code_agent.py"]

[tool.uv]
# litellm 1.106.x 在缺少 mcp 时 import 崩溃；filelock<4 存在已知安全告警。
constraint-dependencies = ["litellm==1.105.7"]
override-dependencies = ["filelock==4.2.6"]
